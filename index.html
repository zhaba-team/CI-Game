<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#123524" />
  <title>жыбий рыр: Стажёр</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="journal" class="panel"></div>
    <button id="menu-btn" class="icon-btn" aria-label="Меню">☰</button>
    <div id="prompt" class="hidden"></div>
    <div id="toasts"></div>
  </div>

  <div id="touch" class="hidden">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <button id="action-btn" class="hidden" aria-label="Действие">💬</button>
  </div>

  <div id="modal-root"></div>

  <div id="start-screen" class="screen">
    <div class="start-card">
      <div class="logo">жыбий рыр</div>
      <h1>Стажёр</h1>
      <p class="subtitle">Первая неделя в IT-компании. Познакомься с командой, выполни задания и узнай, чем на самом деле занимаются программисты.</p>
      <div id="start-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
