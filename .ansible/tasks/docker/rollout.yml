---
- name: Create DIR Docker plugins
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.docker/cli-plugins"
    state: directory
    mode: '0755'

- name: Install rollout plugin
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/wowu/docker-rollout/main/docker-rollout
    dest: "{{ ansible_env.HOME }}/.docker/cli-plugins/docker-rollout"
    mode: '0755'